syntax = "proto3";

package ashen;

message Envelope {
  oneof msg {
    LogMessage log = 1;
    Erase erase = 2;
    Pair pair = 3;
    IsKeyed is_keyed = 4;
    IsKeyedResponse is_keyed_response = 5;
    Disconnect disconnect = 6;
    EchoRequest echo_request = 7;
    EchoResponse echo_response = 8;
  }
}

// A single defmt-encoded log frame, sent spontaneously by the device
// whenever it has queued log output and isn't otherwise busy sending to the
// host.
message LogMessage {
  bytes data = 1;
}

// Sent from the host to the device. Tells the device to erase all keys.
// This will reset the cached host key, and re-generate the device's long-term
// identity key. Disconnects the session like Disconnect.
message Erase {
}

// Sent from the host to the device. Tells the device to commit this host's
// long-term identity key to its key store. Can only be run on an Erase'd device.
message Pair {
}

// Sent from host to the device. A command requesting if the device is keyed,
// i.e. is paired to a trusted peer already.
message IsKeyed {
}

// The device's reply to IsKeyed
message IsKeyedResponse {
  bool is_keyed = 1;
}

// Sent by either side to end the session. The receiver stops processing
// messages on this link and restarts the link with a fresh
// handshake.
message Disconnect {
}

// Sent from the host to the device. The device replies with an
// `EchoResponse` containing `value + 1`. Overflow triggers a panic.
message EchoRequest {
  uint64 value = 1;
}

// Sent from the device to the host in response to an `EchoRequest`.
message EchoResponse {
  uint64 value = 1;
}
