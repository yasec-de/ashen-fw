syntax = "proto3";

package ashen;

message Envelope {
  oneof msg {
    LogMessage log = 1;
    Erase erase = 2;
    PairRequest pair_request = 3;
    PairResponse pair_response = 4;
    StatusRequest status_request= 5;
    StatusResponse status_response = 6;
    Disconnect disconnect = 7;
    EchoRequest echo_request = 8;
    EchoResponse echo_response = 9;
  }
}

// A single defmt-encoded log frame, sent spontaneously by the device
// whenever it has queued log output and isn't otherwise busy sending to the
// host.
message LogMessage {
  bytes data = 1;
}

// Sent from the host to the device. Tells the device to erase all keys.
// This will reset the cached host key, and re-generate the device's long-term
// identity key. Disconnects the session like Disconnect.
message Erase {
}

// Sent from the host to the device. Tells the device to commit this host's
// long-term identity key to its key store. Can only be run on an Erase'd device.
message PairRequest {
}

message PairResponse {
  bool success = 1;
}

// Sent from host to the device. A command requesting the status of the device
// and of this connection.
message StatusRequest {
}

message StatusResponse {
  bool peer_trusted = 1; // Is the currently connected peer (who sent the request) trusted?
  bool is_keyed = 2; // Is the device programmed with *some* key, or is it erased?
}

// Sent by the host to end the session. The receiver responds with its own Disconnect,
// then stops processing messages on this link and restarts the link with a fresh
// handshake.
message Disconnect {
}

// Sent from the host to the device. The device replies with an
// `EchoResponse` containing `value + 1`. Overflow triggers a panic.
message EchoRequest {
  uint64 value = 1;
}

// Sent from the device to the host in response to an `EchoRequest`.
message EchoResponse {
  uint64 value = 1;
}
