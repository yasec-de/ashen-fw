[package]
name = "ashen-fw"
version = "0.1.0"
edition = "2024"

[lib]
name = "ashen_fw"
path = "src/lib.rs"

[[bin]]
name = "ashen-fw"
path = "src/main.rs"
required-features = ["embedded"]

[dependencies]
embedded-io = { version = "0.7.1" }
embedded-io-async = { version = "0.7.0" }
embassy-sync = { version = "0.8.0" }

# Verus support libraries. These let the COBS `encode`/`decode` in `src/cobs.rs`
# be the *same* source that `cargo verus verify` proves correct: a normal
# `cargo build` erases the ghost (proof) code and compiles only the executable
# bodies. Pinned to match the `verus` binary in nix/packages/verus.nix
# (release 0.2026.06.14). `vstd` is used `no_std` (+ alloc) so it links into the
# embedded firmware as well as host builds.
vstd = { version = "=0.0.0-2026-06-14-0213", default-features = false, features = ["alloc"] }
verus_builtin = "=0.0.0-2026-05-17-0151"
verus_builtin_macros = "=0.0.0-2026-06-14-0213"
embassy-futures = { version = "0.1.2" }
subtle = { version = "2", default-features = false }
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "use-curve25519", "use-chacha20poly1305", "use-sha2"] }
micropb = { version = "0.6.0", default-features = false, features = ["alloc", "encode", "decode", "enable-64bit"] }

# Dependencies only used by the embedded firmware binary. Kept out of the
# default dependency set so that `ashen_fw::noise_link` and its tests build
# and run for the host architecture.
[target.'cfg(target_os = "none")'.dependencies]
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32u585ai", "unstable-pac", "time-driver-any", "exti", "memory-x"]  }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }

defmt = "1.1.0"

cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
critical-section = "1.2"
static_cell = { version = "2" }
portable-atomic = { version = "1.5", features = ["unsafe-assume-single-core"] }
emballoc = "0.3.0"

[features]
default = []
# Enables the firmware binary and its embedded-only dependencies. Required
# for embedded builds, e.g. `cargo build --release --features embedded
# --target thumbv7em-none-eabihf`. Disabled by default so that `cargo build`
# and `cargo test` run host-side without extra flags.
embedded = []
# Exposes `ashen_fw::test_util` outside of this crate's own test builds, for
# use by the host-side integration tests under `tests/`. Enabled for those
# via the `[dev-dependencies]` entry below.
test-util = []

[dev-dependencies]
ashen-fw = { path = ".", features = ["test-util"] }

[profile.dev]
opt-level = "s"     # Optimize for size in dev builds too

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable link-time optimization
codegen-units = 1   # Better optimization
debug = true        # Keep debug info for defmt, but smaller than debug = 2
strip = false       # Don't strip, we need symbols for debugging

[build-dependencies]
micropb-gen = "0.6.0"

# The `verus!` macro in `src/cobs/codec.rs` expands to code annotated with
# `cfg(verus_keep_ghost)` (set only when the `verus` verifier compiles the file,
# see `nix build .#cobs-proof`). Declare the cfg so a normal `cargo build` does
# not warn about it being unexpected.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_verify_core)'] }
