[package]
name = "ashen-fw"
version = "0.1.0"
edition = "2024"

[lib]
name = "ashen_fw"
path = "src/lib.rs"

[[bin]]
name = "ashen-fw"
path = "src/main.rs"
required-features = ["embedded"]

[dependencies]
embedded-io = { version = "0.6.0" }
embedded-io-async = { version = "0.6.1" }
embassy-sync = { version = "0.7.2" }
embassy-futures = { version = "0.1.2" }
subtle = { version = "2", default-features = false }
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "use-curve25519", "use-chacha20poly1305", "use-sha2"] }
micropb = { version = "0.6.0", default-features = false, features = ["alloc", "encode", "decode", "enable-64bit"] }

# Dependencies only used by the embedded firmware binary. Kept out of the
# default dependency set so that `ashen_fw::noise_link` and its tests build
# and run for the host architecture.
[target.'cfg(target_os = "none")'.dependencies]
embassy-stm32 = { version = "0.4.0", features = ["defmt", "stm32g474rb", "unstable-pac", "time-driver-any", "exti", "memory-x", "single-bank"]  }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-executor = { version = "0.9.0", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }

defmt = "1.0.1"

embedded-storage = "0.3.1"

cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
critical-section = "1.2"
heapless = { version = "0.8", default-features = false }
embedded-hal = "0.2.6"
static_cell = { version = "2" }
portable-atomic = { version = "1.5", features = ["unsafe-assume-single-core"] }
emballoc = "0.3.0"

[features]
default = []
# Enables the firmware binary and its embedded-only dependencies. Required
# for embedded builds, e.g. `cargo build --release --features embedded
# --target thumbv7em-none-eabihf`. Disabled by default so that `cargo build`
# and `cargo test` run host-side without extra flags.
embedded = []
debug-mode = []

[profile.dev]
opt-level = "s"     # Optimize for size in dev builds too

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable link-time optimization
codegen-units = 1   # Better optimization
debug = true        # Keep debug info for defmt, but smaller than debug = 2
strip = false       # Don't strip, we need symbols for debugging

[build-dependencies]
micropb-gen = "0.6.0"
